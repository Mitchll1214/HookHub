<!DOCTYPE html>
<html lang="zh-CN" class="admin-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>HookHub 管理后台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2320516e'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>H</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin">
  <a class="skip-link" href="#mainContent">跳到主要内容</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-dot"></span> HookHub
        <span class="brand-sub">管理后台</span>
      </a>
      <div class="topbar-actions">
        <span id="initBadge" class="badge badge-warn" role="status" hidden translate="no">
          <span class="badge-dot"></span>未初始化
        </span>
        <a class="gh-link" href="https://github.com/Mitchll1214/HookHub" target="_blank" rel="noopener noreferrer" title="GitHub 开源地址">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          <span>GitHub</span>
        </a>
        <button class="btn" id="logoutBtn">退出登录</button>
      </div>
    </div>
  </header>

  <div class="container admin-container">
    <div class="sidebar-grid">
      <!-- 侧边导航 -->
      <nav class="side-nav" id="sideNav" aria-label="后台导航">
        <div class="nav-group">
          <p class="nav-group-label">工作台</p>
          <a class="nav-item" href="#overview" data-view="overview" aria-current="page">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
            <span class="nav-label">总览</span>
          </a>
        </div>

        <div class="nav-group">
          <p class="nav-group-label">消息分发</p>
          <a class="nav-item" href="#channels" data-view="channels">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg></span>
            <span class="nav-label">渠道管理</span>
          </a>
          <a class="nav-item" href="#tokens" data-view="tokens">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="7.5" cy="16.5" r="4.5"/><path d="M10.8 13.2 21 3"/><path d="m17 6.8 3.2 3.2"/></svg></span>
            <span class="nav-label">令牌管理</span>
          </a>
          <a class="nav-item" href="#routes" data-view="routes">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg></span>
            <span class="nav-label">路由与分发</span>
          </a>
          <a class="nav-item" href="#templates" data-view="templates">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18"/><path d="M9 21V9"/></svg></span>
            <span class="nav-label">模板与映射</span>
          </a>
        </div>

        <div class="nav-group">
          <p class="nav-group-label">系统</p>
          <a class="nav-item" href="#settings" data-view="settings">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
            <span class="nav-label">全局设置</span>
          </a>
        </div>

        <div class="nav-foot">
          <span class="nav-foot-dot" aria-hidden="true"></span>
          <span>无日志设计 · 配置可导出</span>
        </div>
      </nav>

      <!-- 内容区 -->
      <main id="mainContent" tabindex="-1">
        <!-- 各视图由 admin.js 渲染 -->
      </main>
    </div>
  </div>

  <!-- 视图 JS（零构建，按依赖顺序加载） -->
  <script src="/js/common.js"></script>
  <script src="/js/template.js"></script>
  <script src="/js/views/channels.js"></script>
  <script src="/js/views/tokens.js"></script>
  <script src="/js/views/routes.js"></script>
  <script src="/js/views/templates.js"></script>
  <script src="/js/views/settings.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
