<!DOCTYPE html>
<html lang="zh-CN" class="admin-page">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HookHub 管理后台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2320516e'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>H</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-dot"></span> HookHub
        <span class="brand-sub">管理后台</span>
      </a>
      <div class="topbar-actions">
        <span id="initBadge" class="badge badge-warn" style="display:none;">未初始化</span>
        <a class="gh-link" href="https://github.com/Mitchll1214/HookHub" target="_blank" rel="noopener noreferrer" title="GitHub 开源地址">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          <span>GitHub</span>
        </a>
        <button class="btn" id="logoutBtn">退出登录</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="sidebar-grid">
      <!-- 侧边导航 -->
      <nav class="side-nav" id="sideNav">
        <a href="#overview" data-view="overview" class="active">总览</a>
        <a href="#channels" data-view="channels">渠道管理</a>
        <a href="#tokens" data-view="tokens">令牌管理</a>
        <a href="#routes" data-view="routes">路由与分发</a>
        <a href="#templates" data-view="templates">模板与映射</a>
        <a href="#settings" data-view="settings">全局设置</a>
      </nav>

      <!-- 内容区 -->
      <main id="mainContent">
        <!-- 各视图由 app.js 渲染 -->
      </main>
    </div>
  </div>

  <!-- 视图 JS（零构建，按依赖顺序加载） -->
  <script src="/js/common.js"></script>
  <script src="/js/template.js"></script>
  <script src="/js/views/channels.js"></script>
  <script src="/js/views/tokens.js"></script>
  <script src="/js/views/routes.js"></script>
  <script src="/js/views/templates.js"></script>
  <script src="/js/views/settings.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
